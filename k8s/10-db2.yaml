# 仁心醫院 HIS — DB2 12.1 Community（資料庫 HISDB）
# Secret hospital-db2（DB2INST1_PASSWORD）由 scripts/deploy.sh 依 hospital.env 建立
apiVersion: v1
kind: Service
metadata:
  name: hospital-db2
  namespace: hospital
  labels: {app: hospital-db2, tier: db}
spec:
  selector: {app: hospital-db2}
  ports:
  - {name: db2, port: 50000, targetPort: 50000}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hospital-db2
  namespace: hospital
  labels: {app: hospital-db2, tier: db}
spec:
  serviceName: hospital-db2
  replicas: 1
  selector: {matchLabels: {app: hospital-db2}}
  template:
    metadata:
      labels: {app: hospital-db2, tier: db}
    spec:
      # Db2 image 的啟動腳本在第一次建 instance 後會把 fencedid 改成 root:root，
      # 但容器重啟時 db2icrt -update-instance-if-exists 要求 root:db2iadm1（DBI20187E）→ 每次重啟都失敗。
      # 啟動前先改回 root:db2iadm1（GID 1000，與 /database/config/db2inst1 的群組一致）。
      initContainers:
      - name: fix-fencedid
        image: icr.io/db2_community/db2:12.1.3.0
        command: ["sh", "-c", "f=/database/config/db2inst1/sqllib/adm/fencedid; if [ -f $f ]; then chown 0:1000 $f && ls -ln $f; else echo 'no fencedid yet (first start)'; fi"]
        volumeMounts:
        - {name: data, mountPath: /database}
      containers:
      - name: db2
        image: icr.io/db2_community/db2:12.1.3.0
        securityContext:
          privileged: true   # DB2 community image 需要（IPC / 核心參數）
        env:
        - {name: LICENSE, value: accept}
        - {name: DB2INSTANCE, value: db2inst1}
        - {name: DBNAME, value: HISDB}
        - {name: BLU, value: "false"}
        - {name: ENABLE_ORACLE_COMPATIBILITY, value: "false"}
        - {name: PERSISTENT_HOME, value: "true"}
        - {name: ARCHIVE_LOGS, value: "false"}
        - {name: AUTOCONFIG, value: "true"}
        - {name: SAMPLEDB, value: "false"}
        - name: DB2INST1_PASSWORD
          valueFrom: {secretKeyRef: {name: hospital-db2, key: DB2INST1_PASSWORD}}
        ports:
        - {containerPort: 50000, name: db2}
        resources:
          requests: {cpu: 500m, memory: 2Gi}
          limits: {cpu: "2", memory: 4Gi}
        readinessProbe:
          exec:
            command: ["sh", "-c", "test -f /database/.hisdb_seeded && su - db2inst1 -c 'db2 connect to HISDB >/dev/null && db2 terminate >/dev/null'"]
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 15
        volumeMounts:
        - {name: data, mountPath: /database}
        - {name: init, mountPath: /var/custom}
        - {name: sql, mountPath: /hisdb-sql}
      volumes:
      - name: init
        configMap:
          name: hospital-db2-init
          defaultMode: 0755
          items: [{key: init-hisdb.sh, path: init-hisdb.sh}]
      - name: sql
        configMap:
          name: hospital-db2-init
          items: [{key: hisdb.sql, path: hisdb.sql}]
  volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: nfs-client
      resources: {requests: {storage: 20Gi}}
