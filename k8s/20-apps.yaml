# 仁心醫院 HIS — IHS / WAS-HIS / WAS-Pharmacy
# image 為本機 build（scripts/build-images.sh），imagePullPolicy: Never
apiVersion: v1
kind: Service
metadata:
  name: hospital-was-his
  namespace: hospital
  labels: {app: hospital-was-his, tier: was}
spec:
  selector: {app: hospital-was-his}
  ports:
  - {name: http, port: 9080, targetPort: 9080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-was-his
  namespace: hospital
  labels: {app: hospital-was-his, tier: was, hospital.tw/system: outpatient}
spec:
  replicas: 1
  selector: {matchLabels: {app: hospital-was-his}}
  template:
    metadata:
      labels: {app: hospital-was-his, tier: was, hospital.tw/system: outpatient}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: was-his
        image: hospital/was-his:1.2
        imagePullPolicy: Never
        env:
        - {name: INSTANA_SERVICE_NAME, value: "his-outpatient"}
        - {name: PHARMACY_URL, value: "http://hospital-was-pharmacy:9080/pharmacy"}
        - {name: ENABLE_BASIC_LOGGING, value: "true"}
        lifecycle:
          preStop: {exec: {command: ["sh", "-c", "sleep 5"]}}   # 先讓 Service 移除這個 Pod，再停止，滾動更新不掉請求
        ports:
        - {containerPort: 9080, name: http}
        resources:
          requests: {cpu: 500m, memory: 1200Mi}
          limits: {cpu: "2", memory: 1800Mi}
        startupProbe:
          httpGet: {path: /his/api/health, port: 9080}
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet: {path: /his/api/health, port: 9080}
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          tcpSocket: {port: 9080}
          periodSeconds: 20
          failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: hospital-was-pharmacy
  namespace: hospital
  labels: {app: hospital-was-pharmacy, tier: was}
spec:
  selector: {app: hospital-was-pharmacy}
  ports:
  - {name: http, port: 9080, targetPort: 9080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-was-pharmacy
  namespace: hospital
  labels: {app: hospital-was-pharmacy, tier: was, hospital.tw/system: pharmacy}
spec:
  replicas: 1
  selector: {matchLabels: {app: hospital-was-pharmacy}}
  template:
    metadata:
      labels: {app: hospital-was-pharmacy, tier: was, hospital.tw/system: pharmacy}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: was-pharmacy
        image: hospital/was-pharmacy:1.2
        imagePullPolicy: Never
        env:
        - {name: INSTANA_SERVICE_NAME, value: "his-pharmacy"}
        - {name: ENABLE_BASIC_LOGGING, value: "true"}
        lifecycle:
          preStop: {exec: {command: ["sh", "-c", "sleep 5"]}}   # 先讓 Service 移除這個 Pod，再停止，滾動更新不掉請求
        ports:
        - {containerPort: 9080, name: http}
        resources:
          requests: {cpu: 500m, memory: 1200Mi}
          limits: {cpu: "2", memory: 1800Mi}
        startupProbe:
          httpGet: {path: /pharmacy/api/health, port: 9080}
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet: {path: /pharmacy/api/health, port: 9080}
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          tcpSocket: {port: 9080}
          periodSeconds: 20
          failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: hospital-ihs
  namespace: hospital
  labels: {app: hospital-ihs, tier: web}
spec:
  type: NodePort
  selector: {app: hospital-ihs}
  ports:
  - {name: http, port: 8080, targetPort: 8080, nodePort: 30480}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-ihs
  namespace: hospital
  labels: {app: hospital-ihs, tier: web}
spec:
  replicas: 1
  selector: {matchLabels: {app: hospital-ihs}}
  template:
    metadata:
      labels: {app: hospital-ihs, tier: web}
    spec:
      containers:
      - name: ihs
        image: hospital/ihs:1.2
        imagePullPolicy: Never
        env:
        - name: INSTANA_AGENT_HOST
          valueFrom: {fieldRef: {fieldPath: status.hostIP}}
        lifecycle:
          preStop: {exec: {command: ["sh", "-c", "sleep 5"]}}   # 先讓 Service 移除這個 Pod，再停止，滾動更新不掉請求
        ports:
        - {containerPort: 8080, name: http}
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: "1", memory: 512Mi}
        readinessProbe:
          tcpSocket: {port: 8080}
          periodSeconds: 10
